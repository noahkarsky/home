<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Backyard Planner · 1902 Eagle Falls Dr</title>
<style>
:root{
  --bg:#12171c; --panel:#1a2128; --panel2:#222b33; --line:#2f3a44; --ink:#e8edf1; --dim:#93a1ad;
  --accent:#7bd389; --warn:#ffb454; --bad:#ff6b6b; --sun:#ffd166;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:#51606c}
button.on{background:#25402d;border-color:var(--accent)}
input,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
input[type=range]{padding:0;accent-color:var(--sun)}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:650}
header small{color:var(--dim);display:block;font-weight:400}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
main{display:grid;grid-template-columns:240px 1fr 300px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#palette{border-right:1px solid var(--line);padding:8px}
#side{border-left:1px solid var(--line);padding:10px}
#palette h3{margin:12px 4px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:2px 0;padding:5px 7px}
.chip{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid #0006}
.item span.s{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap}
#stage{position:relative;min-width:0;min-height:0;background:#0d1216}
#plan,#three{position:absolute;inset:0;width:100%;height:100%;display:block}
#plan{touch-action:none;cursor:grab}
#three{display:none}
.hud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:#12171ccc;backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;pointer-events:auto}
.hud label{display:flex;align-items:center;gap:6px;color:var(--dim)}
.hud b{color:var(--ink);font-variant-numeric:tabular-nums}
.layers{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:4px;background:#12171ccc;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.layers label{display:flex;gap:6px;align-items:center;color:var(--dim);cursor:pointer}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;padding:0}
#readout{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#12171ccc;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none;white-space:nowrap}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
#side h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
#side h2:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.row label{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:12px}
.row input{width:100%}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.note{color:var(--dim);font-size:13px}
.flag{border-radius:8px;padding:6px 8px;margin:5px 0;font-size:13px;border:1px solid}
.flag.warn{background:#3a2d14;border-color:#6b5222;color:#ffd9a0}
.flag.bad{background:#3b1c1c;border-color:#793030;color:#ffb3b3}
.flag.ok{background:#17301e;border-color:#2c5b38;color:#bdf0c7}
.flag.info{background:#1b2a38;border-color:#2e4a63;color:#b9d8f2}
details{margin:8px 0}
summary{cursor:pointer;color:var(--ink);font-weight:600}
ul.n{margin:6px 0 0;padding-left:18px;color:var(--dim);font-size:13px}
ul.n li{margin:3px 0}
.empty{color:var(--dim);padding:6px 0}
@media (max-width:1000px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(55vh,1fr) auto auto}
  #palette{order:3;border-right:0;border-top:1px solid var(--line);max-height:40vh}
  #side{order:2;border-left:0;border-top:1px solid var(--line);max-height:38vh}
  #stage{order:1}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
</head>
<body>
<div id="app">
<header>
  <h1>Backyard Planner<small>1902 Eagle Falls Dr · Houston TX 77077 · Lot 12, Block 17</small></h1>
  <div class="seg" id="viewSeg"><button id="v2d" class="on">Plan</button><button id="v3d">3D</button></div>
  <select id="scenario" title="Layout"></select>
  <button id="dupScenario" title="Copy this layout into a new one">Copy layout</button>
  <span class="sp"></span>
  <button id="undo">Undo</button>
  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <button id="resetBtn">Reset</button>
  <input id="importFile" type="file" accept="application/json" hidden>
</header>
<main>
  <aside id="palette"><input id="search" placeholder="Search plants &amp; features" style="width:100%"><div id="cat"></div></aside>
  <section id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="three"></div>
    <div class="layers" id="layers">
      <label><input type="checkbox" data-l="shadow" checked> Shadows</label>
      <label><input type="checkbox" data-l="heat"> Sun-hours map</label>

      <label><input type="checkbox" data-l="grid" checked> 5 ft grid</label>

    </div>

    <div class="hud" id="hud">
      <label>Date <input type="date" id="date"></label>
      <span class="seg"><button data-d="2026-12-21">Winter</button><button data-d="2026-03-20">Equinox</button><button data-d="2026-06-21">Summer</button><button data-d="today">Today</button></span>

      <button id="play">Play day</button>
      <span class="seg" id="camSeg" style="display:none"><button data-v="house">From house</button><button data-v="garage">From garage side</button><button data-v="rear">From rear</button><button data-v="top">Top</button></span>
      <span id="sunTxt" style="color:var(--dim)"></span>
      <span class="legend" id="legend" style="display:none"><i style="background:#2a3a66"></i>&lt;2h <i style="background:#2f8f8a"></i>2–4h <i style="background:#e0b84a"></i>4–6h <i style="background:#fff2a8"></i>6h+</span>
    </div>
  </section>
  <aside id="side"></aside>
</main>
</div>

<script type="module">
/* ============================================================

   (labelled dimensions, in feet) and from the walk-around photos.
   Plan coordinates: x → toward the east-side neighbour (Lot 13),
   y → toward the street (Eagle Falls), origin = rear corner at
   Cherry Bend Dr. Plan "up" points N 30°46' E (from the survey).
   ============================================================ */
const LOT = {w:70.46, d:120, north:30.77};   // north = bearing (deg) of plan +y
const LAT = 29.74, LON = -95.60;
const RAD = Math.PI/180;

/* ---------- existing site (feet) ---------- */
const HOUSE  = [[12.3,42.1],[52.0,42.1],[52.0,28.5],[65.3,28.5],[65.3,92.3],[12.3,88.5]];

/* ---------- catalog ---------- */

 {cat:'Trees', items:[
  {k:'crape',   name:'Crape myrtle',       w:12, d:12, h:18,  kind:'tree', color:'#d98aa8', sun:[6,12], shade:.5, note:'Tough, long summer bloom. Choose a mildew-resistant variety (Natchez, Muskogee).'},
  {k:'fig',     name:'Fig · Celeste',      w:10, d:10, h:10,  kind:'tree', color:'#6f9b4e', sun:[6,12], shade:.5, note:'Thrives in Houston. Prune to 8–10 ft for easy picking.'},

 {cat:'Shrubs & perennials', items:[
  {k:'turks',   name:'Turk\'s cap',        w:4,  d:4,  h:4,   kind:'shrub', color:'#d9423e', sun:[2,6],  note:'Native hummingbird plant that loves part shade. Perfect under the oak.'},

  {k:'ginger',  name:'Shell ginger',       w:4,  d:4,  h:5,   kind:'shrub', color:'#7fb069', sun:[1,5],  note:'Lush tropical look in shade; may die back in a hard freeze.'},
  {k:'muhly',   name:'Gulf muhly',         w:3,  d:3,  h:3,   kind:'shrub', color:'#e7a1c4', sun:[6,12], note:'Pink plumes in fall. Great in gravel.'},
  {k:'salvia',  name:'Salvia greggii',     w:3,  d:3,  h:3,   kind:'shrub', color:'#e4505d', sun:[6,12], note:'Tough bloomer, pollinators love it.'},
  {k:'lantana', name:'Lantana',            w:4,  d:4,  h:3,   kind:'shrub', color:'#f2a33c', sun:[6,12], note:'Heat-proof color. Cut back in late winter.'},
  {k:'esperanza',name:'Esperanza',         w:5,  d:5,  h:6,   kind:'shrub', color:'#f6d130', sun:[6,12], note:'Yellow bells from May to frost.'},
  {k:'texassage',name:'Texas sage',        w:5,  d:5,  h:5,   kind:'shrub', color:'#9db4b0', sun:[6,12], note:'Silver foliage, purple blooms after rain. Hates wet feet.'},
  {k:'rose',    name:'Knock Out rose',     w:4,  d:4,  h:4,   kind:'shrub', color:'#e0457b', sun:[6,12], note:'Low maintenance rose.'},
  {k:'plumbago',name:'Blue plumbago',      w:4,  d:4,  h:4,   kind:'shrub', color:'#7aa6e8', sun:[4,12], note:'Soft blue flowers; dies back and returns after freezes.'},
  {k:'gardenia',name:'Gardenia',           w:4,  d:4,  h:4,   kind:'shrub', color:'#f1f1e8', sun:[3,8],  note:'Wants acidic soil; use a large pot in Houston clay.'},
  {k:'jasmine', name:'Confederate jasmine',w:6,  d:1.5,h:6,   kind:'shrub', color:'#e9f2dc', sun:[3,12], note:'Fragrant evergreen vine. Put it on the lattice or fence.'}]},
 {cat:'Edibles', items:[
  {k:'blueberry',name:'Blueberry (pot)',   w:3,  d:3,  h:4,   kind:'shrub', color:'#5a6fa8', sun:[5,10], note:'Rabbiteye varieties. Grow in a pot with acid mix, since Houston soil is too alkaline.'},
  {k:'rosemary',name:'Rosemary',           w:3,  d:3,  h:3,   kind:'shrub', color:'#6c8f6b', sun:[6,12], note:'Perennial in Houston. Needs good drainage.'}]}
];
const DEF = {}; CATALOG.forEach(c => c.items.forEach(i => DEF[i.k] = i));

/* ---------- state ---------- */
const KEY = 'backyard-planner-v1';
let _id = 1; const uid = () => 'i' + Date.now().toString(36) + (_id++);
const mk = (k,x,y,rot=0) => ({id:uid(), k, x, y, rot, w:DEF[k].w, d:DEF[k].d});
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function defaultState(){
  return { active:0, oak:{x:37, y:4, r:16}, date:'2026-10-11', hour:17.5,
    sc:[
      {name:'A · As it is today', items:[]},
      {name:'B · Edible garden', items:[mk('bed48',56,24),mk('bed48',65,24),mk('bed48',60,18.5),mk('salvia',45,26),mk('salvia',49,26),mk('herb',48,33.5),mk('rosemary',35.5,24),mk('turks',31,6),mk('castiron',34,10)]},
      {name:'C · Entertainer', items:[mk('pergola',41,35.5),mk('firepit',50,20),mk('seating',28,37),mk('turks',31,6),mk('ginger',36,10),mk('muhly',62,10.5),mk('muhly',66,10.5),mk('lantana',58,10.5),mk('jasmine',40,1.5)]}
    ]};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); if (!S || !Array.isArray(S.sc)) S = null; } catch(e) { S = null; }
S = S || defaultState();
const sc = () => S.sc[S.active];
let sel = null;
const hist = [];
function snap(){ hist.push(JSON.stringify(S)); if (hist.length > 80) hist.shift(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ---------- sun ---------- */
function isDST(Y,M,D){
  const nth = (m,wd,n) => { const f = new Date(Date.UTC(Y,m,1)).getUTCDay(); return 1 + ((wd - f + 7) % 7) + 7*(n-1); };
  const start = nth(2,0,2), end = nth(10,0,1);
  const v = M*100 + D;
  return v >= 300 + start && v < 1000 + 100 + end;
}
function sunPos(date, hour){
  const [Y,M,D] = date.split('-').map(Number);
  const doy = Math.round((Date.UTC(Y,M-1,D) - Date.UTC(Y,0,0)) / 864e5);
  const tz = isDST(Y,M,D) ? -5 : -6;
  const g = 2*Math.PI/365 * (doy - 1 + (hour - 12)/24);
  const eqt = 229.18*(0.000075 + 0.001868*Math.cos(g) - 0.032077*Math.sin(g) - 0.014615*Math.cos(2*g) - 0.040849*Math.sin(2*g));
  const dec = 0.006918 - 0.399912*Math.cos(g) + 0.070257*Math.sin(g) - 0.006758*Math.cos(2*g) + 0.000907*Math.sin(2*g) - 0.002697*Math.cos(3*g) + 0.00148*Math.sin(3*g);
  const tst = hour*60 + eqt + 4*LON - 60*tz;
  const ha = (tst/4 - 180) * RAD, lat = LAT * RAD;
  const alt = Math.asin(Math.sin(lat)*Math.sin(dec) + Math.cos(lat)*Math.cos(dec)*Math.cos(ha));
  const az = Math.atan2(Math.sin(ha), Math.cos(ha)*Math.sin(lat) - Math.tan(dec)*Math.cos(lat)) + Math.PI;   // from north, clockwise
  return {alt, az};
}
// unit vector toward the sun in plan axes (x right, y toward the street, z up)
function sunVec(sp){
  const E = Math.sin(sp.az)*Math.cos(sp.alt), N = Math.cos(sp.az)*Math.cos(sp.alt), U = Math.sin(sp.alt);
  const th = LOT.north * RAD;
  return {x: E*Math.cos(th) - N*Math.sin(th), y: E*Math.sin(th) + N*Math.cos(th), z: U};
}
const fmtHour = h => { const hh = Math.floor(h), mm = Math.round((h-hh)*60); const m2 = mm === 60 ? 0 : mm, h2 = mm === 60 ? hh+1 : hh; return `${((h2+11)%12)+1}:${String(m2).padStart(2,'0')} ${h2 >= 12 ? 'PM' : 'AM'}`; };
const compass = az => ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(((az/RAD)%360)/22.5) % 16];

/* ---------- geometry helpers ---------- */
function itemPoly(it){
  const d = DEF[it.k], rx = it.w/2, ry = it.d/2;
  let pts;
  if (d.shape === 'circle') { pts = []; for (let i = 0; i < 20; i++) { const a = i/20*2*Math.PI; pts.push([rx*Math.cos(a), ry*Math.sin(a)]); } }
  else pts = [[-rx,-ry],[rx,-ry],[rx,ry],[-rx,ry]];
  const c = Math.cos(it.rot*RAD), s = Math.sin(it.rot*RAD);
  return pts.map(([px,py]) => [it.x + px*c - py*s, it.y + px*s + py*c]);

function flagsFor(it){
  const d = DEF[it.k], P = itemPoly(it), out = [];

  const lowPlant = d.kind === 'shrub';
  if (overlap(P, UE)) out.push([tall ? 'bad' : lowPlant ? 'info' : 'warn', tall ? 'In the 8 ft rear utility easement: trees and structures can be removed by the utility. Keep low plants only.' : lowPlant ? 'Sits in the rear utility easement. Fine for a low plant; the utility may dig it up.' : 'In the rear utility easement. Avoid hardscape and footings here.']);
  if (overlap(P, AE)) out.push([tall ? 'bad' : lowPlant ? 'info' : 'warn', tall ? 'Under the aerial (overhead-line) easement: keep it low or move it clear.' : lowPlant ? 'Under the overhead-line easement. Fine for a low plant.' : 'Inside the aerial easement. Keep it low.']);
  if (overlap(P, HOUSE) || overlap(P, GARAGE)) out.push(['bad', 'Overlaps the house or garage.']);
  if (overlap(P, NOOK)) out.push(['bad', 'Blocks the AC and utility nook. Keep 3 ft clear for service access.']);
  const dOak = Math.hypot(it.x - S.oak.x, it.y - S.oak.y);
  if ((d.kind === 'struct' || d.kind === 'bed' || d.kind === 'flat') && dOak < 15 + Math.max(it.w,it.d)/2) out.push(['warn', 'Inside the live oak\'s root zone (~15 ft from the trunk). Avoid fill, trenching and footings here. Use above-ground builds or move it.']);
  if ((d.kind === 'tree' || d.kind === 'shrub') && inPoly([it.x, it.y], PATIO)) out.push(['warn', 'Centered on the tile patio. Use a pot or cut a planting pocket.']);
  if (d.kind === 'tree') {
    const nearFence = Math.min(it.y - 0, 70.46 - it.x) < it.w/2 - 1;
    if (nearFence) out.push(['warn', 'Canopy will reach the fence. Plan on pruning or move it in.']);
  }
  if (d.sun) {
    const h = hoursAt(it.x, it.y);
    if (h !== null && h >= 0) {
      if (h < d.sun[0] - .5) out.push(['warn', `Only ${h.toFixed(1)} h of direct sun on this date. It wants ${d.sun[0]}+ h.`]);
      else if (h > d.sun[1] + .5) out.push(['warn', `${h.toFixed(1)} h of sun is more than it wants (up to ${d.sun[1]} h). Give it afternoon shade.`]);
      else out.push(['ok', `Sun fit looks good: ${h.toFixed(1)} h on this date (wants ${d.sun[0]}–${d.sun[1]} h).`]);
    }

}

// scan the fenced yard for the position with the fewest conflicts and the best sun fit
function bestSpot(it){
  const d = DEF[it.k]; let best = null; dragging = true;      // reuse the cached sun-hours grid
  try {
    for (let y = 1.5; y <= 42; y += 1) for (let x = 11; x <= 69.5; x += 1) {
      const c = {...it, x, y}, P = itemPoly(c);
      if (P.some(([px,py]) => px < 10.6 || px > 70.2 || py < .3 || py > 43.5)) continue;
      let sc = 0; for (const f of flagsFor(c)) sc += f[0] === 'bad' ? 100 : f[0] === 'warn' ? 10 : 0;
      if (d.kind !== 'flat' && d.kind !== 'struct' && d.kind !== 'bed' && overlap(P, PATIO)) sc += 5;
      sc += Math.hypot(x - it.x, y - it.y) * .02;

  $('#layers').style.display = $('.zoom').style.display = $('#readout').style.display = m === '2d' ? '' : 'none';
  if (m === '3d') { init3d().then(() => { if (api3d) { api3d.sync(); api3d.resize(); } }); } else applyView();
}
$('#camSeg').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (b && api3d) api3d.goView(b.dataset.v); });
$('#v2d').onclick = () => setMode('2d'); $('#v3d').onclick = () => setMode('3d');

/* ---------- boot ---------- */
renderPalette(); renderScenarios(); fitView();
// deep links: #heat  #3d  #A/#B/#C  #summer/#winter  (combine with commas, e.g. #B,heat)
for (const t of location.hash.slice(1).toLowerCase().split(',')) {
  if (t === 'heat') { L.heat = true; document.querySelector('[data-l=heat]').checked = true; }
  else if (/^[a-z]$/.test(t) && S.sc[t.charCodeAt(0) - 97]) S.active = t.charCodeAt(0) - 97;
  else if (t === 'summer') S.date = '2026-06-21'; else if (t === 'winter') S.date = '2026-12-21';
  else if (t.startsWith('h') && !isNaN(+t.slice(1))) S.hour = +t.slice(1);
}
refresh();
if (location.hash.toLowerCase().includes('3d')) setMode('3d');
</script>
</body>
